<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glyph Daisies</title>
<style>
:root{--bg:#000;--fg:#e8e8e8;--dim:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{width:min(100vw,500px);height:min(86vh,880px);display:block}
.hud{width:min(100vw,500px);padding:0 16px;font-size:12px;color:var(--dim);line-height:1.6;box-sizing:border-box}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud" id="hud"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud');
const rnd=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647})();
const TAU=Math.PI*2, W2=(x,y)=>[(x-368)/400,(1288-y)/400];
const P=[]; // x,y,z,n[3],k,o ; butterfly: bf
const bez=(a,b,c,d,t)=>{const m=1-t;return[0,1].map(i=>m*m*m*a[i]+3*m*m*t*b[i]+3*m*t*t*c[i]+t*t*t*d[i])};
// stems (px control points)
const stems=[
 [[330,1288],[345,1050],[352,850],[350,690],360],
 [[415,1288],[395,1050],[330,880],[228,712],300],
 [[392,1288],[385,1060],[400,880],[420,792],200],
 [[282,1100],[285,980],[290,900],[304,830],90]];
for(const s of stems){const a=W2(...s[0]),b=W2(...s[1]),c=W2(...s[2]),d=W2(...s[3]);
 for(let i=0;i<s[4];i++){const t=rnd(),p=bez(a,b,c,d,t),ph=rnd()*TAU;
  P.push({x:p[0]+.006*Math.cos(ph),y:p[1],z:.006*Math.sin(ph),nx:Math.cos(ph),ny:0,nz:Math.sin(ph),k:0,o:.02+(1-Math.min(1,(p[1]+1.5)/3.2))*0+ (1-t)*.3})}}
// flowers
const fl=[{c:[362,650],L:.2,tl:.8,n:16,roll:.1,np:55},{c:[223,685],L:.1,tl:.6,n:13,roll:.5,np:30},{c:[432,765],L:.1,tl:.5,n:13,roll:-.4,np:30}];
fl.forEach((f,fi)=>{const c=W2(...f.c),tl=f.tl,e1=[1,0,0],e2=[0,Math.cos(tl),Math.sin(tl)],nn=[0,-Math.sin(tl),Math.cos(tl)];
 for(let i=0;i<f.n;i++){const a0=TAU*i/f.n+f.roll+(rnd()-.5)*.15;
  for(let j=0;j<f.np;j++){const t=rnd(),rad=f.L*(.22+t*.8),hw=f.L*.17*Math.sin(Math.PI*(.12+.88*t)),lat=(rnd()*2-1)*hw,ca=Math.cos(a0),sa=Math.sin(a0),
   u=ca*rad-sa*lat,v=sa*rad+ca*lat,dr=t*t*f.L*.35;
   P.push({x:c[0]+e1[0]*u+e2[0]*v+nn[0]*dr,y:c[1]+e2[1]*v+nn[1]*dr,z:e2[2]*v+nn[2]*dr,nx:nn[0]+ca*.3,ny:nn[1]+sa*.3,nz:nn[2]+.4,k:1,o:.4+fi*.06+i/f.n*.18})}}
 for(let j=0;j<(fi?50:140);j++){const rr=f.L*.26*Math.sqrt(rnd()),a=rnd()*TAU,u=rr*Math.cos(a),v=rr*Math.sin(a);
  P.push({x:c[0]+u,y:c[1]+e2[1]*v,z:e2[2]*v+.01,nx:nn[0],ny:nn[1],nz:nn[2],k:2,o:.45+fi*.06+.15})}});
// bud
{const c=W2(305,815);for(let i=0;i<90;i++){const t=rnd(),a=rnd()*TAU,r=.032*Math.sin(Math.PI*(.1+.8*t));
 P.push({x:c[0]+r*Math.cos(a),y:c[1]+(t-.3)*.075,z:r*Math.sin(a),nx:Math.cos(a),ny:.2,nz:Math.sin(a),k:4,o:.62+t*.1})}}
// butterflies
const bf=[[540,380,.13,-.5,0],[425,465,.12,.5,1.3],[315,495,.1,.3,2.4],[475,560,.1,-.4,3.6]];
bf.forEach((b,bi)=>{const c=W2(b[0],b[1]);b.c=c;
 for(let i=0;i<260;i++){const side=i%2?1:-1,up=rnd()<.62,u=.08+rnd()*.92,hh=(up?.38:.24)*Math.sin(Math.PI*(.1+.9*u)),v=(up?.28:-.3)*(.4+u*.6)+(rnd()*2-1)*hh;
  P.push({bf:b,bi,u,v,side,k:3,o:.72+bi*.06+rnd()*.04})}
 for(let i=0;i<14;i++)P.push({bf:b,bi,u:0,v:(i/14-.5)*.8,side:0,k:3,o:.72+bi*.06})});
const FALL=Array.from({length:90},()=>({x:(rnd()*2-1)*.95,sp:.12+rnd()*.18,ph:rnd()*20,sw:.05+rnd()*.1,sz:rnd()}));
const RAMP="il1tfrxnuvczXYUJCLQ0OZmwqpdbkhao#MW&8%B@$";
const norm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l)};
function resize(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
const T0=performance.now(),LOOP=18,COL=[[170,185,160],[255,255,255],[255,170,30],[255,255,255],[235,245,225]];
function frame(now){
  const t=(now-T0)/1000,lt=t%LOOP,W=cv.clientWidth,H=cv.clientHeight,S=H/3.25,ox=W/2,oy=H*.985;
  ctx.clearRect(0,0,W,H);
  const rot=Math.sin(t*.45)*.45,c=Math.cos(rot),s=Math.sin(rot);
  const key=norm([0,.8,.6]),rim=norm([Math.cos(t*.9),.5,Math.sin(t*.9)]),spk=norm([Math.cos(t*2.1),.9,Math.sin(t*2.1)]);
  const draw=Math.min(1.02,lt/8),fade=lt>16?Math.max(0,1-(lt-16)/2):1;
  const out=[];let glints=0;
  for(const p of P){
    if(p.o>draw)continue;
    const age=Math.min(1,(draw-p.o)*6);
    let X,Y,Z,nx=p.nx,ny=p.ny,nz=p.nz;
    if(p.bf){const b=p.bf,f=Math.sin(t*6+b[4])*.75+.25,sz=b[2],r=b[3];
      let wx=p.side*p.u*Math.cos(f)*sz,wy=p.v*sz,wz=p.u*Math.sin(f)*sz*1.2;
      X=b.c[0]+wx*Math.cos(r)-wy*Math.sin(r)+Math.sin(t*.7+b[4])*.04;
      Y=b.c[1]+wx*Math.sin(r)+wy*Math.cos(r)+Math.sin(t*1.1+b[4])*.035+Math.sin(t*6+b[4])*.01;
      Z=wz;nx=p.side*Math.sin(f)*.6;ny=.2;nz=1}
    else{X=p.x;Y=p.y;Z=p.z}
    const x=X*c+Z*s,z=-X*s+Z*c,nxr=nx*c+nz*s,nzr=-nx*s+nz*c,nl=Math.hypot(nxr,ny,nzr)||1;
    const a=nxr/nl,b2=ny/nl,c2=nzr/nl;
    let L=Math.max(0,a*key[0]+b2*key[1]+c2*key[2])*.5+Math.max(0,a*rim[0]+b2*rim[1]+c2*rim[2])*.45+.18,g=0;
    if(p.k===1||p.k===3){const d=a*spk[0]+b2*spk[1]+c2*spk[2];if(d>.96){g=(d-.96)/.04;L+=g*.8}}
    if(p.k===1||p.k===3)L=.35+L*.8;
    if(p.k===0)L*=.7;
    if(g>.6)glints++;
    out.push({sx:ox+x*S,sy:oy-Y*S,z,L:Math.min(1,L)*fade*age,g,k:p.k})}
  if(draw>.85){const fa=Math.min(1,(draw-.85)*8)*fade;
    for(const f of FALL){const y=3.3-((t*f.sp+f.ph)%3.4),x=f.x+Math.sin(t*.8+f.ph)*f.sw*3,tum=Math.abs(Math.sin(t*1.7+f.ph*3)),th=t*1.3+f.ph;
      const L=(.35+.65*tum)*fa*(y<.15?Math.max(0,y/.15):1);
      for(let j=-1;j<=1;j++)out.push({sx:ox+x*c*S+Math.cos(th)*j*3*(.4+tum),sy:oy-y*S+Math.sin(th)*j*3*(.4+tum),z:f.sz-.5,L:L*(j?.7:1),g:0,k:f.sz>.85?2:1})}}
  out.sort((a,b)=>a.z-b.z);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='8px ui-monospace,Menlo,monospace';
  for(const q of out){
    if(q.L<.05)continue;
    const ch=RAMP[Math.min(RAMP.length-1,(q.L*RAMP.length)|0)],cl=COL[q.k],m=.3+q.L*.7;
    ctx.fillStyle=`rgb(${cl[0]*m|0},${cl[1]*m|0},${cl[2]*m|0})`;
    ctx.fillText(ch,q.sx,q.sy);
    if(q.g>.7){ctx.strokeStyle=`rgba(255,255,255,${q.g*fade})`;ctx.lineWidth=1;const l=4+q.g*8;
      ctx.beginPath();ctx.moveTo(q.sx-l,q.sy);ctx.lineTo(q.sx+l,q.sy);ctx.moveTo(q.sx,q.sy-l);ctx.lineTo(q.sx,q.sy+l);ctx.stroke()}}
  hud.innerHTML=`t ${lt.toFixed(2)}s<br>rotation ${(rot*180/Math.PI).toFixed(2)}° &nbsp; glints ${glints}<br>letters ${out.length.toLocaleString()}`;
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
